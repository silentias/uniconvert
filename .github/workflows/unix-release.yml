name: Unix release builds

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/build-unix-release.sh
      - name: Archive with executable permissions
        shell: bash
        run: |
          for directory in release/linux-* release/macos-*; do
            if [ -d "$directory" ]; then
              tar -czf "$directory.tar.gz" -C release "$(basename "$directory")"
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: uniconvert-${{ matrix.os }}
          path: release/*.tar.gz
          if-no-files-found: error
