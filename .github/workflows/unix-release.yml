name: Desktop release builds

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Windows FFmpeg binaries
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ffmpeg --no-progress --yes
          $ffmpegPackage = Join-Path $env:ChocolateyInstall 'lib\ffmpeg'
          $ffmpeg = Get-ChildItem -LiteralPath $ffmpegPackage -Recurse -File -Filter ffmpeg.exe | Select-Object -First 1
          $ffprobe = Get-ChildItem -LiteralPath $ffmpegPackage -Recurse -File -Filter ffprobe.exe | Select-Object -First 1
          if (-not $ffmpeg -or -not $ffprobe) { throw 'Chocolatey FFmpeg binaries were not found' }
          New-Item -ItemType Directory -Force -Path tauri-app/binaries | Out-Null
          Copy-Item -LiteralPath $ffmpeg.FullName -Destination tauri-app/binaries/ffmpeg.exe -Force
          Copy-Item -LiteralPath $ffprobe.FullName -Destination tauri-app/binaries/ffprobe.exe -Force
      - run: pnpm install --frozen-lockfile
      - name: Build Linux or macOS release
        if: runner.os != 'Windows'
        run: bash scripts/build-unix-release.sh
      - name: Build Windows release
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-windows-installer.ps1
      - name: Archive with executable permissions
        if: runner.os != 'Windows'
        shell: bash
        run: |
          for directory in release/linux-* release/macos-*; do
            if [ -d "$directory" ]; then
              tar -czf "$directory.tar.gz" -C release "$(basename "$directory")"
            fi
          done
      - uses: actions/upload-artifact@v6
        with:
          name: uniconvert-${{ matrix.os }}
          path: |
            release/*.tar.gz
            release/macos-*/*.dmg
            release/win/*.exe
          if-no-files-found: error
