[package]
name = "uniconvert-cli"
version = "1.1.0"
edition = "2021"
description = "Local media conversion and metadata CLI for UniConvert"

[[bin]]
name = "uniconvert"
path = "src/main.rs"

[dependencies]
uniconvert-core = { path = "../core" }
clap = { version = "4.6", features = ["derive"] }
ctrlc = "3.5"
serde_json = "1"

[dev-dependencies]
tempfile = "3"
